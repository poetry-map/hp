<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">
　　<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words On The Ground</title>

    <link rel="stylesheet" href="hpstyle.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html, body {

            height: 100%;
            margin: 0;
            font-family: serif;

        }

        .menu-button {
    position: relative;
    z-index: 1001;
}

.map-description {
    width: calc(100% - 40px);
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
}

        #map {

            height: 500px;
            width: 100%;
            margin-bottom: 40px;

        }


        #poemModal {

            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            color: white;
            padding: 40px;
            box-sizing: border-box;
            overflow: auto;

        }


        #close {

            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 28px;
            cursor: pointer;

        }


        #modal-title {

            font-weight: normal;

        }


        #modal-body {

            line-height: 2;

        }


        /* Update */

        #update-list {
    width: calc(100% - 40px);
    max-width: 680px;
    margin: 40px auto;
}

nav > h2 {
    width: calc(100% - 40px);
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
}

.update-item {
    margin-bottom: 25px;
    cursor: pointer;
}


        .update-date {

            font-size: 0.9em;
            margin-right: 20px;

        }


        /* 青いピン */

        .blue-pin {

            width: 22px;
            height: 22px;
            background: #4285f4;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            opacity: 0.7;

        }


        .blue-pin::after {

            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 7px;
            left: 7px;

        }

        /* 赤いピン */

        .red-pin {
    width: 22px;
    height: 22px;
    background: #e53935;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    opacity: 0.7;
}

.red-pin::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    top: 7px;
    left: 7px;
}


        /* ピンのジャンプ */

     .pin-jump {
    animation: pinJump 0.8s ease;
}

@keyframes pinJump {

    0% {
        transform: translateY(0) rotate(-45deg);
    }

    30% {
        transform: translateY(-25px) rotate(-45deg);
    }

    50% {
        transform: translateY(0) rotate(-45deg);
    }

    70% {
        transform: translateY(-12px) rotate(-45deg);
    }

    100% {
        transform: translateY(0) rotate(-45deg);
    }

}

    </style>

</head>


<body>


<header>

      <a href="index.html" class="name">
        小倉尚子｜Ogura Naoko
    </a>

    <button class="menu-button" aria-label="メニューを開く">
        ≡
    </button>


    <nav class="menu">

    <a href="works.html">Works</a>
    <a href="words on the ground.html">Words On The Ground</a>
    <a href="about.html">About</a>

    <div class="social-links">

    <a href="https://www.instagram.com/ichito_1/" target="_blank" aria-label="Instagram">
        <img src="Instagram_Glyph_Black.svg" alt="">
    </a>


    <a href="https://soundcloud.com/ichito-528352315" target="_blank" aria-label="SoundCloud">
        <img src="https://cdn.prod.website-files.com/62a0a0168756b795debc65bc/69ef2abb30d1aae32ea4f517_Horizontal%20Black%20(transparent)-download.webp" alt="">
    </a>

　　</div>
　　</nav>

</header>


<nav>

    <p class="map-description">
     地図に立ったピンを押すと、その場所にまつわる詩やエッセイを読むことができます<br>
     ＊赤いピンは詩集『NATIVE VOID』掲載詩の所在です
    </p>


    <div id="map"></div>


    <h2>Update</h2>

    <div id="update-list"></div>

</nav>


<div id="poemModal">

    <div
        id="close"
        onclick="document.getElementById('poemModal').style.display='none'"
    >

        &times;

    </div>


    <h2 id="modal-title"></h2>

    <p id="modal-body"></p>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="spots.js"></script>

<script>


const map = L.map('map', {
    maxBounds: [[-85, -180], [85, 180]]
}).setView([35.527, 139.75], 15);
;


/* 航空写真 */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {
        attribution: 'Tiles &copy; Esri'
}

).addTo(map);



/* ピンを作る */

spots.forEach(spot => {


    const pinClass = spot.id ? "red-pin" : "blue-pin";

const pinIcon = L.divIcon({
    html: `<div class="${pinClass}"></div>`,
    className: '',
    iconSize: [60, 60],
    iconAnchor: [30, 30]
});


    const marker = L.marker(

        [spot.lat, spot.lng],

        { icon: pinIcon }

    ).addTo(map);


    /* UPDATEからこのピンを呼び出すために記憶 */

    spot.marker = marker;


    /* ピンを押したとき */

    marker.on('click', function() {


        document.getElementById(

            "modal-title"

        ).innerText = spot.title;


        document.getElementById(

            "modal-body"

        ).innerHTML = spot.poem;


        document.getElementById(

            "poemModal"

        ).style.display = "block";


    });

});



/* UPDATEを作る */

const updateList = document.getElementById("update-list");


spots.forEach(spot => {


    const item = document.createElement("div");


    item.className = "update-item";


    item.innerHTML = `

        <span class="update-date">${spot.date}</span>

        <span>${spot.title}</span>

    `;


    /* UPDATEを押したとき */

   item.addEventListener("click", function() {
    window.scrollTo({
        top: document.getElementById("map").offsetTop,
        behavior: "smooth"
    });

    map.setView([spot.lat, spot.lng], 15);

    const pin = spot.marker.getElement().querySelector(".blue-pin, .red-pin");
    pin.classList.remove("pin-jump");
    void pin.offsetWidth;
    pin.classList.add("pin-jump");
　　 });


    updateList.appendChild(item);

});



/* 地図をクリックしたら詩の画面を閉じる */

map.on('click', function() {

    document.getElementById(

        "poemModal"

    ).style.display = "none";

});

/* NATIVE VOIDページより */

const params = new URLSearchParams(window.location.search);
const spotName = params.get("spot");

const targetSpot = spots.find(
    spot => spot.id === spotName
);

if (targetSpot) {

    map.setView(
        [targetSpot.lat, targetSpot.lng],
        15,
        { animate: false }
    );

    setTimeout(function() {

        const pin = targetSpot.marker
            .getElement()
            .querySelector(".blue-pin, .red-pin");

        pin.classList.remove("pin-jump");
        void pin.offsetWidth;
        pin.classList.add("pin-jump");

    }, 100);
}

</script>

<script>

const menuButton = document.querySelector(".menu-button");
const menu = document.querySelector(".menu");

menuButton.addEventListener("click", function() {

    menu.classList.toggle("open");

    if (menu.classList.contains("open")) {
        menuButton.textContent = "×";
        menuButton.setAttribute("aria-label", "メニューを閉じる");
    } else {
        menuButton.textContent = "≡";
        menuButton.setAttribute("aria-label", "メニューを開く");
    }

});

const lat = parseFloat(params.get("lat"));
const lng = parseFloat(params.get("lng"));

const targetSpotByLocation = spots.find(spot =>
    Number(spot.lat) === lat &&
    Number(spot.lng) === lng
);

if (targetSpotByLocation) {

    map.setView(
        [targetSpotByLocation.lat, targetSpotByLocation.lng],
        15,
        { animate: false }
    );

    setTimeout(function() {

        const pin = targetSpotByLocation.marker
            .getElement()
            .querySelector(".blue-pin, .red-pin");

        pin.classList.remove("pin-jump");
        void pin.offsetWidth;
        pin.classList.add("pin-jump");

    }, 100);
}

</script>


</body>

</html>
