            left: 7px;

}

    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    top: 7px;
    left: 7px;
}

     .pin-jump {
    animation: pinJump 0.8s ease;
}

@keyframes pinJump {

    0% {
        transform: translateY(0) rotate(-45deg);
    }

    30% {
        transform: translateY(-25px) rotate(-45deg);
    }

    50% {
        transform: translateY(0) rotate(-45deg);
    }

    70% {
        transform: translateY(-12px) rotate(-45deg);
    }

    100% {

/* ピンを作る */

spots.forEach(spot => {


    const pinClass = spot.id ? "red-pin" : "blue-pin";

const pinIcon = L.divIcon({
    html: `<div class="${pinClass}"></div>`,
    className: '',
    iconSize: [60, 60],
    iconAnchor: [30, 30]
});


    const marker = L.marker(

        [spot.lat, spot.lng],

        { icon: pinIcon }

    ).addTo(map);


    /* UPDATEからこのピンを呼び出すために記憶 */

    spot.marker = marker;


    /* ピンを押したとき */

    marker.on('click', function() {


        document.getElementById(

            "modal-title"

        ).innerText = spot.title;


        document.getElementById(

            "modal-body"

        ).innerHTML = spot.poem;


        document.getElementById(

            "poemModal"

        ).style.display = "block";


    });

});



/* UPDATEを作る */

const updateList = document.getElementById("update-list");


spots.forEach(spot => {


    const item = document.createElement("div");


    item.className = "update-item";


    item.innerHTML = `

        <span class="update-date">${spot.date}</span>

        <span>${spot.title}</span>

    `;


    /* UPDATEを押したとき */

   item.addEventListener("click", function() {
    window.scrollTo({
        top: document.getElementById("map").offsetTop,
        behavior: "smooth"
    });

    map.setView([spot.lat, spot.lng], 15);

    const pin = spot.marker.getElement().querySelector(".blue-pin, .red-pin");
    pin.classList.remove("pin-jump");
    void pin.offsetWidth;
    pin.classList.add("pin-jump");
　　 });


    updateList.appendChild(item);

});



/* 地図をクリックしたら詩の画面を閉じる */

map.on('click', function() {

    document.getElementById(

        "poemModal"

    ).style.display = "none";

});

/* NATIVE VOIDページより */

const params = new URLSearchParams(window.location.search);
const spotName = params.get("spot");

const targetSpot = spots.find(
    spot => spot.id === spotName
);

if (targetSpot) {

    map.setView(
        [targetSpot.lat, targetSpot.lng],
        15,
        { animate: false }
    );

    setTimeout(function() {

        const pin = targetSpot.marker
            .getElement()
            .querySelector(".blue-pin, red-pin");

        pin.classList.remove("pin-jump");
        void pin.offsetWidth;
        pin.classList.add("pin-jump");

    }, 100);
}
